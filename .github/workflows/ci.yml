name: CI — Corporate RAG Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Vite Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install & Build
        run: |
          npm ci
          npm run build
      - name: Lint
        run: npm run lint --if-present
